<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" id="nvs-metadata" width="850" viewBox="0 0 802 109" style="background:#fff" role="graphics-document document" aria-roledescription="packet" lang="zh-CN" aria-label="NVS 元数据的 64 位布局" height="116"><style>#nvs-metadata{font-family:"trebuchet ms",verdana,arial,sans-serif;font-size:16px;fill:#333;}@keyframes edge-animation-frame{from{stroke-dashoffset:0;}}@keyframes dash{to{stroke-dashoffset:0;}}#nvs-metadata .edge-animation-slow{stroke-dasharray:9,5!important;stroke-dashoffset:900;animation:dash 50s linear infinite;stroke-linecap:round;}#nvs-metadata .edge-animation-fast{stroke-dasharray:9,5!important;stroke-dashoffset:900;animation:dash 20s linear infinite;stroke-linecap:round;}#nvs-metadata .error-icon{fill:#552222;}#nvs-metadata .error-text{fill:#552222;stroke:#552222;}#nvs-metadata .edge-thickness-normal{stroke-width:1px;}#nvs-metadata .edge-thickness-thick{stroke-width:3.5px;}#nvs-metadata .edge-pattern-solid{stroke-dasharray:0;}#nvs-metadata .edge-thickness-invisible{stroke-width:0;fill:none;}#nvs-metadata .edge-pattern-dashed{stroke-dasharray:3;}#nvs-metadata .edge-pattern-dotted{stroke-dasharray:2;}#nvs-metadata .marker{fill:#333333;stroke:#333333;}#nvs-metadata .marker.cross{stroke:#333333;}#nvs-metadata svg{font-family:"trebuchet ms",verdana,arial,sans-serif;font-size:16px;}#nvs-metadata p{margin:0;}#nvs-metadata .packetByte{font-size:10px;}#nvs-metadata .packetByte.start{fill:black;}#nvs-metadata .packetByte.end{fill:black;}#nvs-metadata .packetLabel{fill:black;font-size:12px;}#nvs-metadata .packetTitle{fill:black;font-size:14px;}#nvs-metadata .packetBlock{stroke:black;stroke-width:1;fill:#efefef;}#nvs-metadata .node .neo-node{stroke:#9370DB;}#nvs-metadata [data-look="neo"].node rect,#nvs-metadata [data-look="neo"].cluster rect,#nvs-metadata [data-look="neo"].node polygon{stroke:#9370DB;filter:drop-shadow(1px 2px 2px rgba(185, 185, 185, 1));}#nvs-metadata [data-look="neo"].swimlane.cluster rect{filter:none;}#nvs-metadata [data-look="neo"].node path{stroke:#9370DB;stroke-width:1px;}#nvs-metadata [data-look="neo"].node .outer-path{filter:drop-shadow(1px 2px 2px rgba(185, 185, 185, 1));}#nvs-metadata [data-look="neo"].node .neo-line path{stroke:#9370DB;filter:none;}#nvs-metadata [data-look="neo"].node circle{stroke:#9370DB;filter:drop-shadow(1px 2px 2px rgba(185, 185, 185, 1));}#nvs-metadata [data-look="neo"].node circle .state-start{fill:#000000;}#nvs-metadata [data-look="neo"].icon-shape .icon{fill:#9370DB;filter:drop-shadow(1px 2px 2px rgba(185, 185, 185, 1));}#nvs-metadata [data-look="neo"].icon-shape .icon-neo path{stroke:#9370DB;filter:drop-shadow(1px 2px 2px rgba(185, 185, 185, 1));}#nvs-metadata :root{--mermaid-font-family:"trebuchet ms",verdana,arial,sans-serif;}</style><g/><g><rect x="1" y="15" width="395" height="32" class="packetBlock"/><text x="198.5" y="31" class="packetLabel" dominant-baseline="middle" text-anchor="middle">标识符（id）</text><text x="1" y="13" class="packetByte start" dominant-baseline="auto" text-anchor="start">0</text><text x="396" y="13" class="packetByte end" dominant-baseline="auto" text-anchor="end">15</text><rect x="401" y="15" width="395" height="32" class="packetBlock"/><text x="598.5" y="31" class="packetLabel" dominant-baseline="middle" text-anchor="middle">扇区内数据偏移</text><text x="401" y="13" class="packetByte start" dominant-baseline="auto" text-anchor="start">16</text><text x="796" y="13" class="packetByte end" dominant-baseline="auto" text-anchor="end">31</text></g><g><rect x="1" y="62" width="395" height="32" class="packetBlock"/><text x="198.5" y="78" class="packetLabel" dominant-baseline="middle" text-anchor="middle">数据长度</text><text x="1" y="60" class="packetByte start" dominant-baseline="auto" text-anchor="start">32</text><text x="396" y="60" class="packetByte end" dominant-baseline="auto" text-anchor="end">47</text><rect x="401" y="62" width="195" height="32" class="packetBlock"/><text x="498.5" y="78" class="packetLabel" dominant-baseline="middle" text-anchor="middle">part（未使用）</text><text x="401" y="60" class="packetByte start" dominant-baseline="auto" text-anchor="start">48</text><text x="596" y="60" class="packetByte end" dominant-baseline="auto" text-anchor="end">55</text><rect x="601" y="62" width="195" height="32" class="packetBlock"/><text x="698.5" y="78" class="packetLabel" dominant-baseline="middle" text-anchor="middle">CRC-8</text><text x="601" y="60" class="packetByte start" dominant-baseline="auto" text-anchor="start">56</text><text x="796" y="60" class="packetByte end" dominant-baseline="auto" text-anchor="end">63</text></g><text x="401" y="85.5" dominant-baseline="middle" text-anchor="middle" class="packetTitle"/></svg>